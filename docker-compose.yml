# ─────────────────────────────────────────────────────────────────────────────
# MayaSpace — Docker Compose
#
# Usage:
#   cp .env.example .env          # then edit (SESSION_SECRET, MAYA_URL, ADMIN_HANDLES…)
#   docker compose up -d --build
#
# Notes:
#   - Storage is embedded SQLite, so no database service is required.
#   - For federation, MAYA_URL in .env must be the public https:// origin.
#   - Behind nginx/Caddy, set TRUST_PROXY=1 in .env.
# ─────────────────────────────────────────────────────────────────────────────
name: mayaspace

services:
  mayaspace:
    build: .
    image: mayaspace:latest
    container_name: mayaspace
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      # Compose reads PORT from the project .env; defaults to 3000.
      - "${PORT:-3414}:${PORT:-3414}"
    volumes:
      # SQLite DB, uploads and sessions all live under ./data in the container.
      - maya-data:/app/data
      # Bind-mount alternative (chown the host dir to the container uid first):
      # - ./data:/app/data

volumes:
  maya-data: